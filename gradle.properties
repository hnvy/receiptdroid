org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The OCR engine that reads receipts: mlkit or tesseract. This line is all there is to change; the build
# takes that engine's code (app/src/ocr-<engine>) and library, and leaves the other out of the app.
#   mlkit      Google's ML Kit: the more accurate on photos. Closed source; its logging is cut off from
#              the network like everything else in the app.
#   tesseract  Tesseract: open source throughout, no Google code at all. Somewhat less accurate.
# For one build only: ./gradlew assembleRelease -Preceipts.ocr=tesseract
receipts.ocr=mlkit
