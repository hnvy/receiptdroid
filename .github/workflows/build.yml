name: Build

on:
#  push:
#    branches: [main, master]
#    tags: ["v*", "[0-9]*"]
#  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 1.2.3 or 1.2.3-beta.1 (blank: a development build)"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish a GitHub release of it, tagged v<version> (only with a version)"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          given="${INPUT_VERSION#"${INPUT_VERSION%%[![:space:]]*}"}"   # without spaces before…
          given="${given%"${given##*[![:space:]]}"}"                   # …or after
          given="${given#v}"
          publish=false
          tag=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            name="${GITHUB_REF_NAME#v}"
            from="The tag $GITHUB_REF_NAME"
            tag="$GITHUB_REF_NAME"
            publish=true
            # Run by hand on a tag: the release is the tag's, so the APKs must be its version.
            if [[ -n "$given" && "$given" != "$name" ]]; then
              echo "::error::This run is on the tag $GITHUB_REF_NAME, so its version is $name: leave the version blank, or run it on a branch"
              exit 1
            fi
          elif [[ -n "$given" ]]; then
            name="$given"
            from="The version given ($given)"
            tag="v$given"
            [[ "$INPUT_PUBLISH" == true ]] && publish=true
          else
            name=""
          fi
          if [[ -n "$name" ]]; then
            if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$from isn't a version like 1.2.3 or 1.2.3-beta.1"
              exit 1
            fi
            # Base 10, so that 08 isn't read as a (bad) octal number.
            major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
            if (( minor > 99 || patch > 99 )); then
              echo "::error::Minor and patch versions go up to 99 (the version code is major·10000 + minor·100 + patch)"
              exit 1
            fi
            code=$(( major * 10000 + minor * 100 + patch ))
            if (( code < 1 )); then
              echo "::error::0.0.0 has no version code: start at 0.0.1"
              exit 1
            fi
          else
            # Not a release: any release installs over it.
            name="0.0.0-dev+${GITHUB_SHA::7}"
            code=1
          fi
          # Publishing by hand tags this commit: not if the tag is already on another one, whose release
          # would then hold APKs built from different code.
          if [[ "$publish" == true && "$GITHUB_REF_TYPE" != tag ]]; then
            if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null) && [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::The tag $tag is already on another commit (${tagged::7}), not this one (${GITHUB_SHA::7}): give a new version, or run this on that tag"
              exit 1
            fi
          fi
          prerelease=false
          [[ "$name" == *-* && "$publish" == true ]] && prerelease=true
          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          if [[ "$publish" == true ]]; then
            echo "Version $name ($code), to be published as $tag"
          else
            echo "Version $name ($code), not published"
          fi

  build:
    name: Build (${{ matrix.ocr }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ocr: [mlkit, tesseract]
    env:
      OCR: ${{ matrix.ocr }}
      LEDGEDROID_VERSION_NAME: ${{ needs.version.outputs.name }}
      LEDGEDROID_VERSION_CODE: ${{ needs.version.outputs.code }}
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.LEDGEDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            if [[ "$PUBLISH" == true ]]; then
              echo "::error::A release needs the LEDGEDROID_KEYSTORE_BASE64 secret (and its passwords): without it, the APKs couldn't update an installed Receiptdroid"
              exit 1
            fi
            if [[ "$LEDGEDROID_VERSION_NAME" != 0.0.0-dev+* ]]; then
              echo "::warning::No release key: these $LEDGEDROID_VERSION_NAME APKs are signed with a throwaway debug key, so they can't update an installed Receiptdroid"
            else
              echo "::notice::No release key: the release APKs are signed with a throwaway debug key"
            fi
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "LEDGEDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          LEDGEDROID_KEYSTORE_PASSWORD: ${{ secrets.LEDGEDROID_KEYSTORE_PASSWORD }}
          LEDGEDROID_KEY_ALIAS: ${{ secrets.LEDGEDROID_KEY_ALIAS }}
          LEDGEDROID_KEY_PASSWORD: ${{ secrets.LEDGEDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace "-Preceipts.ocr=$OCR" testDebugUnitTest assembleDebug assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APKs can't use the network
        run: |
          tools=("$ANDROID_HOME"/build-tools/*/)
          aapt2="$(printf '%s\n' "${tools[@]}" | sort -V | tail -1)aapt2"
          status=0
          for apk in app/build/outputs/apk/*/*.apk; do
            permissions=$("$aapt2" dump permissions "$apk")
            echo "$apk:"
            echo "  ${permissions//$'\n'/$'\n'  }"
            if echo "$permissions" | grep -E "name='android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)'"; then
              echo "::error file=$apk::This APK asks for network access"
              status=1
            fi
          done
          exit $status

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/receiptdroid-$LEDGEDROID_VERSION_NAME-$OCR.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/receiptdroid-$LEDGEDROID_VERSION_NAME-$OCR-debug.apk"
          {
            echo "### Receiptdroid $LEDGEDROID_VERSION_NAME ($OCR)"
            echo
            echo "| APK | Size |"
            echo "|---|---|"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            echo
            echo "No network permissions in either APK."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receiptdroid-${{ matrix.ocr }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: receiptdroid-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # The release APKs only: the debug ones are in the run's artifacts.
          apks=("dist/receiptdroid-$NAME-mlkit.apk" "dist/receiptdroid-$NAME-tesseract.apk")
          for apk in "${apks[@]}"; do
            if [[ ! -f "$apk" ]]; then
              built=(dist/*)
              echo "::error::$apk wasn't built. Built: ${built[*]}"
              exit 1
            fi
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Made already, eg on GitHub's page for a new release, which made the tag too: the APKs join it.
            echo "There's a release for $TAG already: adding the APKs to it"
            gh release upload "$TAG" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            options=()
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              options+=(--verify-tag)
            else
              # Run by hand: the release makes the tag, on the commit that was built.
              options+=(--target "$GITHUB_SHA")
            fi
            [[ "$PRERELEASE" == true ]] && options+=(--prerelease)
            notes="Two builds, the same app with a different OCR engine: **mlkit** (Google's ML Kit, the more accurate on photos) or **tesseract** (open source throughout). Install one; they can replace each other.

          Neither can use the network: they have no permission to."
            gh release create "$TAG" "${apks[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Receiptdroid $NAME" \
              --notes "$notes" \
              --generate-notes \
              "${options[@]}"
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "Published: $url"
          echo "### Published [Receiptdroid $NAME]($url)" >> "$GITHUB_STEP_SUMMARY"
